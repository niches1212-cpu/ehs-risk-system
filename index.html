<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS 數位風險鑑別系統</title>
<!-- MSAL from Microsoft CDN (works on GitHub Pages / any non-SP host) -->
<script src="msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;background:#f1f5f9;color:#1e293b;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
input,select,textarea,button{font-family:inherit;font-size:12px}
/* ── Login Screen ── */
#login-screen{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:24px}
.login-box{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:40px;text-align:center;max-width:400px;width:90%}
.login-logo{width:56px;height:56px;background:linear-gradient(135deg,#f97316,#ea580c);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}
.login-title{font-size:20px;font-weight:900;color:#f1f5f9;margin-bottom:6px}
.login-sub{font-size:12px;color:#475569;margin-bottom:28px;line-height:1.6}
.login-btn{width:100%;padding:14px;background:#f97316;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.login-btn:hover{background:#ea580c;transform:translateY(-1px);box-shadow:0 8px 20px rgba(249,115,22,.3)}
.login-btn:disabled{background:#334155;color:#64748b;cursor:not-allowed;transform:none;box-shadow:none}
.login-status{font-size:11px;color:#64748b;margin-top:14px;min-height:16px}
.login-user{font-size:11px;color:#4ade80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);padding:6px 14px;border-radius:20px}
/* ── Top Nav ── */
#topnav{background:#0f172a;height:52px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;border-bottom:1px solid #1e293b}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:272px;min-width:272px;background:#0f172a;display:flex;flex-direction:column;overflow:hidden}
#sidebar-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#content{flex:1;overflow-y:auto;background:#f1f5f9;padding:20px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#f97316,#ea580c);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-text{font-weight:900;font-size:14px;color:#f1f5f9}
.logo-sub{font-size:9px;color:#475569;font-weight:600;letter-spacing:.08em}
.nav-tabs{display:flex;gap:4px;margin-left:20px}
.nav-tab{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:#94a3b8;border:none;background:none;transition:all .15s}
.nav-tab:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}
.nav-tab.active{background:#f97316;color:#fff}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{font-size:10px;color:#4ade80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.15);padding:3px 10px;border-radius:20px;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout-btn{font-size:10px;color:#64748b;background:none;border:1px solid #334155;border-radius:5px;padding:3px 8px;cursor:pointer}
.signout-btn:hover{color:#f87171;border-color:#f87171}
/* Sidebar */
.sb-sec{border-bottom:1px solid rgba(255,255,255,.07);padding:12px}
.sb-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:#475569;text-transform:uppercase;margin-bottom:7px}
.sb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.sb-input,.sb-select{width:100%;border:1px solid #1e293b;border-radius:5px;padding:6px 8px;background:#0a1120;color:#94a3b8;font-size:11px;outline:none;transition:border-color .15s}
.sb-input:focus,.sb-select:focus{border-color:#f97316;color:#e2e8f0}
.upload-area{margin-bottom:6px}
.upload-label-text{font-size:9px;font-weight:700;margin-bottom:3px;display:block}
.upload-btn{width:100%;padding:7px;border:1px dashed #334155;border-radius:5px;background:transparent;color:#64748b;font-size:11px;cursor:pointer;text-align:center;transition:all .15s}
.upload-btn:hover{border-color:#f97316;color:#f97316}
/* SP section */
.sp-section{background:#1e293b;border-radius:8px;padding:10px;margin-top:8px}
.sp-title{font-size:9px;font-weight:700;color:#22d3ee;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.sp-btn{width:100%;padding:7px;background:#164e63;color:#67e8f9;border:1px solid #164e63;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;margin-bottom:5px}
.sp-btn:hover{background:#0e7490;color:#fff}
.sp-btn:disabled{background:#1e293b;color:#334155;cursor:not-allowed}
#sp-tree{max-height:200px;overflow-y:auto;background:#0a1120;border-radius:4px;padding:6px;display:none;margin-bottom:5px}
.sp-file-item{padding:4px 6px;border-radius:4px;cursor:pointer;font-size:10px;transition:background .12s;margin-bottom:2px}
.sp-file-item:hover{background:rgba(34,211,238,.12)}
#sp-status{font-size:9px;color:#475569;min-height:14px}
/* Proc list */
#proc-list{padding:0 12px 8px;flex:1}
.proc-item{padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all .15s}
.proc-item:hover{background:rgba(255,255,255,.05)}
.proc-item.active{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.35)}
.proc-name{font-size:12px;font-weight:700;color:#e2e8f0}
.proc-item.active .proc-name{color:#fb923c}
.proc-sub{font-size:10px;color:#475569;margin-top:2px}
.proc-tags{display:flex;gap:4px;margin-top:4px}
.ptag{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700}
.ptag-d{background:rgba(249,115,22,.15);color:#f97316}
.ptag-s{background:rgba(255,255,255,.06);color:#64748b}
.add-proc-btn{margin:8px 12px 0;padding:8px;border:1px dashed #334155;border-radius:5px;background:transparent;color:#475569;font-size:11px;cursor:pointer;width:calc(100% - 24px);transition:all .15s;display:block}
.add-proc-btn:hover{border-color:#64748b;color:#94a3b8}
#sb-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
.export-btn{width:100%;padding:9px;background:#f97316;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.export-btn:hover{background:#ea580c}
.export-hint{font-size:9px;color:#334155;text-align:center;margin-top:5px}
/* Content */
#empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:8px}
/* proc header */
.proc-header-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.proc-meta{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.meta-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-year{background:rgba(249,115,22,.1);color:#ea580c;border:1px solid rgba(249,115,22,.25)}
.badge-plant{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.badge-dept-input{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(249,115,22,.08);color:#ea580c;border:1px solid rgba(249,115,22,.25);outline:none;width:84px}
.edit-h1{font-size:20px;font-weight:900;color:#0f172a;border:none;outline:none;width:100%;border-bottom:2px dashed transparent;padding:2px 0;background:transparent;transition:border-color .15s}
.edit-h1:hover,.edit-h1:focus{border-bottom-color:#f97316}
.edit-h2{font-size:14px;color:#64748b;border:none;outline:none;width:100%;border-bottom:1px dashed transparent;padding:2px 0;background:transparent;margin-top:3px;transition:border-color .15s}
.edit-h2:hover,.edit-h2:focus{border-bottom-color:#f97316}
.proc-header-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #f1f5f9;flex-wrap:wrap;gap:8px}
.proc-stats{display:flex;gap:12px;font-size:11px;color:#64748b}
.proc-stats strong{color:#0f172a}
/* step card */
.step-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.04);overflow:hidden}
.step-head{background:linear-gradient(135deg,#0f172a,#1e293b);padding:10px 14px;display:flex;align-items:center;gap:10px}
.step-num{width:26px;height:26px;background:rgba(249,115,22,.8);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0}
.step-name-input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:6px 10px;font-weight:700;font-size:13px;color:#f1f5f9;outline:none}
.step-name-input:focus{border-color:rgba(249,115,22,.6)}
.block{border-radius:8px;overflow:hidden;margin:12px 14px;border:1px solid #e2e8f0}
.block-head{padding:9px 12px;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.block-body{padding:14px}
.form-grid{display:grid;gap:8px;margin-bottom:10px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
.form-label{font-size:10px;font-weight:700;color:#64748b;margin-bottom:3px;display:block}
.form-input,.form-select,.form-textarea{width:100%;border:1px solid #e2e8f0;border-radius:5px;padding:6px 9px;font-size:12px;outline:none;background:#f8fafc;color:#1e293b;transition:border-color .15s,box-shadow .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.1);background:#fff}
.form-textarea{resize:vertical;min-height:52px}
.env-row,.saf-row{border-radius:6px;padding:12px;margin-bottom:8px;position:relative}
.env-row{background:#f0fdf4;border:1px solid #bbf7d0}
.saf-row{background:#eff6ff;border:1px solid #bfdbfe}
.score-box{border-radius:5px;padding:8px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid}
.b-H,.b-C1{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.b-M,.b-C2{background:#fffbeb;color:#d97706;border-color:#fde68a}
.b-L,.b-C3,.b-C4{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.b-sea{background:#f8fafc;color:#64748b;border-color:#e2e8f0}
.viol-row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.viol-label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#dc2626;cursor:pointer}
.viol-label input[type=checkbox]{accent-color:#dc2626;width:13px;height:13px}
.result-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.result-badges{display:flex;gap:6px}
.treat-box{border-radius:7px;padding:12px;margin-top:10px}
.treat-orange{background:#fff7ed;border:1px solid #fed7aa}
.treat-red{background:#fef2f2;border:1px solid #fecaca}
.treat-blue{background:#eff6ff;border:1px solid #bfdbfe}
.treat-label{font-size:11px;font-weight:700;margin-bottom:6px;display:block}
.treat-orange .treat-label{color:#b45309}
.treat-red .treat-label{color:#b91c1c}
.treat-blue .treat-label{color:#1d4ed8}
.del-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fee2e2;color:#dc2626;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;padding:0}
.del-btn:hover{background:#dc2626;color:#fff}
.add-row-btn{width:100%;padding:8px;border:2px dashed;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;transition:all .15s;margin-top:6px}
.add-env-btn{border-color:#86efac;color:#16a34a}
.add-env-btn:hover{background:#f0fdf4}
.add-saf-btn{border-color:#93c5fd;color:#2563eb}
.add-saf-btn:hover{background:#eff6ff}
.add-step-btn{width:100%;padding:14px;border:2px dashed #cbd5e1;border-radius:10px;background:transparent;color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin-top:4px;transition:all .15s}
.add-step-btn:hover{border-color:#f97316;color:#f97316;background:#fff7ed}
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.btn-danger:hover{background:#dc2626;color:#fff}
.btn-ghost{background:transparent;color:#64748b;border:1px solid #e2e8f0}
.btn-ghost:hover{background:#f1f5f9}
/* Dashboard */
.dash-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:800px){.dash-grid4{grid-template-columns:1fr 1fr}}
.stat-card{background:#fff;border-radius:10px;padding:18px;border:1px solid #e2e8f0;border-top-width:4px;box-shadow:0 2px 8px rgba(0,0,0,.04);text-align:center}
.treat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:800px){.treat-grid{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:9px 12px;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;text-align:left;border-bottom:2px solid #e2e8f0}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px}
tr:hover td{background:#fafafa}
/* Toast */
#toast{position:fixed;top:62px;right:16px;z-index:9999;padding:11px 18px;border-radius:8px;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;align-items:center;gap:8px;max-width:360px;border-left:4px solid}
#toast.show{display:flex}
#toast.t-ok{background:#0f172a;color:#4ade80;border-left-color:#16a34a}
#toast.t-err{background:#0f172a;color:#f87171;border-left-color:#dc2626}
#toast.t-info{background:#0f172a;color:#60a5fa;border-left-color:#2563eb}
/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:740px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.ft{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
.ft th{background:#0f172a;color:#fff;padding:6px 9px;text-align:left}
.ft td{padding:5px 9px;border:1px solid #e2e8f0;font-family:monospace}
.ft tr:nth-child(even) td{background:#f8fafc}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🛡️</div>
    <div class="login-title">EHS 數位風險鑑別系統</div>
    <div class="login-sub">使用漢民科技 Microsoft 帳號登入<br>即可存取 SharePoint 資料夾中的評估資料</div>
    <button class="login-btn" id="login-btn" data-action="ms-login">
      <svg width="18" height="18" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      使用 Microsoft 帳號登入
    </button>
    <div class="login-status" id="login-status">請點擊上方按鈕登入</div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>
<!-- Modal -->
<div id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>

<!-- ── TOP NAV ── -->
<nav id="topnav" style="display:none">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <div><div class="logo-text">EHS 數位風險鑑別系統</div><div class="logo-sub">ENVIRONMENTAL · HEALTH · SAFETY</div></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-action="switch-tab" data-tab="entry">📋 評估填寫</button>
    <button class="nav-tab" data-action="switch-tab" data-tab="dash">📊 統計儀表板</button>
    <button class="nav-tab" data-action="show-format">📄 匯入格式</button>
  </div>
  <div class="nav-right">
    <span class="user-chip" id="user-chip"></span>
    <span class="nav-right" style="font-size:11px;color:#475569" id="nav-count">載入 0 筆</span>
    <button class="signout-btn" data-action="ms-logout">登出</button>
  </div>
</nav>

<!-- ── MAIN ── -->
<div id="main" style="display:none">
  <div id="sidebar">
    <div id="sidebar-scroll">
      <!-- Year / Plant / Dept -->
      <div class="sb-sec">
        <div class="sb-label">年度 / 廠區</div>
        <div class="sb-grid2">
          <div>
            <div style="font-size:9px;color:#475569;margin-bottom:3px;font-weight:700">年度</div>
            <select class="sb-select" id="sel-year">
              <option>2023</option><option>2024</option><option>2025</option>
              <option selected>2026</option><option>2027</option>
            </select>
          </div>
          <div>
            <div style="font-size:9px;color:#475569;margin-bottom:3px;font-weight:700">廠區</div>
            <select class="sb-select" id="sel-plant">
              <option>ZY</option><option>PDC</option><option>Tainan</option><option>Taichung</option><option>HsinChu</option>
            </select>
          </div>
        </div>
        <div>
          <div style="font-size:9px;color:#475569;margin-bottom:3px;font-weight:700">部門代碼</div>
          <input class="sb-input" id="inp-dept" placeholder="輸入部門代碼..."/>
        </div>
      </div>

      <!-- Local CSV Upload -->
      <div class="sb-sec">
        <div class="sb-label">匯入本機 CSV</div>
        <div class="upload-area">
          <div class="upload-label-text" style="color:#4ade80">🌿 環境考量面 (Env)</div>
          <button class="upload-btn" data-action="open-env-file">📄 選擇 Env CSV</button>
          <input type="file" id="inp-env" accept=".csv" style="display:none" data-action="csv-env">
        </div>
        <div class="upload-area">
          <div class="upload-label-text" style="color:#60a5fa">🛡️ 安全衛生 (Risk)</div>
          <button class="upload-btn" data-action="open-risk-file">📄 選擇 Risk CSV</button>
          <input type="file" id="inp-risk" accept=".csv" style="display:none" data-action="csv-risk">
        </div>
        <button class="upload-btn" style="margin-top:4px" data-action="load-demo">🗂️ 載入範例資料</button>

        <!-- SharePoint via Graph API -->
        <div class="sp-section">
          <div class="sp-title">☁️ 從 SharePoint 讀取 CSV</div>
          <button class="sp-btn" data-action="sp-browse">📂 瀏覽 ISO_Risk_Env_Review 資料夾</button>
          <div id="sp-tree"></div>
          <div id="sp-status">登入後即可瀏覽 SharePoint 資料夾</div>
        </div>
      </div>

      <!-- Process List -->
      <div class="sb-sec" style="padding-bottom:6px;flex-shrink:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="sb-label" style="margin:0">作業流程清單</div>
          <span style="font-size:9px;color:#334155" id="proc-count">0 筆</span>
        </div>
      </div>
      <div id="proc-list"></div>
      <button class="add-proc-btn" data-action="create-proc">＋ 新增作業流程</button>
    </div>
    <div id="sb-footer">
      <button class="export-btn" data-action="export-csv">⬇️ 另存新檔 (匯出 CSV)</button>
      <div class="export-hint" id="export-hint">選擇年度/廠區/部門後匯出</div>
    </div>
  </div>

  <div id="content">
    <div id="empty-state">
      <div style="font-size:48px;opacity:.25">📋</div>
      <div style="font-weight:700;font-size:15px">尚未選擇作業流程</div>
      <div style="font-size:12px;color:#94a3b8">從左側匯入 CSV 或直接從 SharePoint 讀取</div>
    </div>
    <div id="entry-view" style="display:none"></div>
    <div id="dash-view" style="display:none"></div>
  </div>
</div>

<script src="ehs_system.js"></script>
<script>
// ============================================================
// MSAL CONFIG — 填入你的 Azure AD App 資訊
// ============================================================
var MSAL_CONFIG = {
  clientId: 'df0903c0-bcde-447f-91ad-8001db795f28',
  tenantId: 'd80752ed-8e75-4dec-b80a-1478c61e15ed',  // 漢民科技 tenant ID (已填好)
  scopes: ['Files.ReadWrite', 'Sites.ReadWrite.All', 'User.Read']
};

var SP_SITE   = 'hetw.sharepoint.com:/sites/EHS209';   // SharePoint 網站
var SP_FOLDER = 'ISO_Risk_Env_Review';                 // 根資料夾名稱

var msalInstance = null;
var graphToken   = null;

// Init MSAL
function initMsal(){
  try{
    if(typeof msal === 'undefined'){
      setLoginStatus('⚠️ MSAL 函式庫載入失敗，請重新整理頁面');
      return;
    }
    var cfg = {
      auth: {
        clientId:    MSAL_CONFIG.clientId,
        authority:   'https://login.microsoftonline.com/' + MSAL_CONFIG.tenantId,
        redirectUri: 'https://niches1212-cpu.github.io/ehs-risk-system/'
      },
      cache: { cacheLocation: 'sessionStorage' }
    };
    msalInstance = new msal.PublicClientApplication(cfg);
    msalInstance.handleRedirectPromise().then(function(resp){
      if(resp) finishLogin(resp);
      else {
        var accs = msalInstance.getAllAccounts();
        if(accs.length) acquireToken(accs[0]);
        else setLoginStatus('請點擊上方按鈕登入');
      }
    }).catch(function(e){ setLoginStatus('⚠️ '+e.message); });
  }catch(e){
    setLoginStatus('⚠️ 初始化失敗：'+e.message);
    console.error('MSAL init error:', e);
  }
}

function msLogin(){
  if(!msalInstance){ setLoginStatus('⚠️ MSAL 未初始化'); return; }
  if(MSAL_CONFIG.clientId === 'YOUR_CLIENT_ID_HERE'){
    setLoginStatus('⚠️ 請先填入 Client ID（聯絡 IT 或 EHS 系統管理員）');
    return;
  }
  setLoginStatus('⏳ 開啟登入視窗...');
  document.getElementById('login-btn').disabled = true;
  msalInstance.loginPopup({ scopes: MSAL_CONFIG.scopes })
    .then(finishLogin)
    .catch(function(e){
      setLoginStatus('❌ 登入失敗：' + e.message);
      document.getElementById('login-btn').disabled = false;
    });
}

function acquireToken(account){
  setLoginStatus('⏳ 取得授權中...');
  msalInstance.acquireTokenSilent({
    scopes: MSAL_CONFIG.scopes,
    account: account
  }).then(function(resp){ finishLogin(resp); })
    .catch(function(){
      msalInstance.acquireTokenPopup({ scopes: MSAL_CONFIG.scopes })
        .then(finishLogin)
        .catch(function(e){ setLoginStatus('❌ '+e.message); });
    });
}

function finishLogin(resp){
  graphToken = resp.accessToken;
  var name = resp.account.name || resp.account.username;
  // Show main UI
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('topnav').style.display = '';
  document.getElementById('main').style.display = '';
  document.getElementById('user-chip').textContent = '👤 ' + name;
  document.getElementById('sp-status').textContent = '✅ 已登入，點「瀏覽」讀取資料夾';
  toast('✅ 歡迎，' + name, 'ok');
  renderSidebar();
}

function msLogout(){
  if(msalInstance){ msalInstance.logoutPopup(); }
  graphToken = null;
  document.getElementById('login-screen').style.display = '';
  document.getElementById('topnav').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  setLoginStatus('已登出，請重新登入');
}

function setLoginStatus(msg){ document.getElementById('login-status').textContent = msg; }

// ============================================================
// GRAPH API — 讀取 SharePoint 資料夾
// ============================================================
async function graphGet(url){
  if(!graphToken) throw new Error('尚未登入');
  var r = await fetch('https://graph.microsoft.com/v1.0' + url, {
    headers: { 'Authorization': 'Bearer ' + graphToken, 'Accept': 'application/json' }
  });
  if(!r.ok) throw new Error('Graph API HTTP ' + r.status);
  return await r.json();
}

async function graphGetText(url){
  if(!graphToken) throw new Error('尚未登入');
  var r = await fetch('https://graph.microsoft.com/v1.0' + url, {
    headers: { 'Authorization': 'Bearer ' + graphToken }
  });
  if(!r.ok) throw new Error('Graph API HTTP ' + r.status);
  return await r.text();
}

// 取得 SP 網站 ID 與文件庫 ID（快取）
var _siteId = null, _driveId = null;
async function getSiteDrive(){
  if(_siteId && _driveId) return {siteId:_siteId, driveId:_driveId};
  var site = await graphGet('/sites/' + SP_SITE);
  _siteId = site.id;
  var drives = await graphGet('/sites/' + _siteId + '/drives');
  // 找 Shared Documents
  var drive = drives.value.find(function(d){ return d.name==='文件' || d.name==='Documents' || d.name==='Shared Documents'; });
  if(!drive) drive = drives.value[0];
  _driveId = drive.id;
  return {siteId:_siteId, driveId:_driveId};
}

// 遞迴找所有 CSV（最多 2 層）
async function graphFindCSV(folderPath, depth){
  if(depth===undefined) depth=0;
  var sd = await getSiteDrive();
  var path = '/drives/' + sd.driveId + '/root:/' + folderPath + ':/children';
  var data = await graphGet(path);
  var csvFiles = [];
  var folders = [];
  (data.value||[]).forEach(function(item){
    if(item.file && item.name.toLowerCase().endsWith('.csv')){
      csvFiles.push({name:item.name, id:item.id, folder:folderPath.split('/').pop()});
    } else if(item.folder && depth < 2){
      folders.push(item.name);
    }
  });
  if(depth < 2){
    for(var i=0;i<folders.length;i++){
      var sub = await graphFindCSV(folderPath + '/' + folders[i], depth+1);
      sub.forEach(function(f){ csvFiles.push(f); });
    }
  }
  return csvFiles;
}

async function graphReadFile(itemId){
  var sd = await getSiteDrive();
  return await graphGetText('/drives/' + sd.driveId + '/items/' + itemId + '/content');
}

// SP Browse via Graph API
async function spBrowse(){
  var tree = document.getElementById('sp-tree');
  tree.style.display = 'block';
  tree.innerHTML = '<div style="color:#475569;font-size:11px;padding:4px">⏳ 掃描 SharePoint 資料夾...</div>';
  spStatus('⏳ 連線中...');
  try{
    var files = await graphFindCSV(SP_FOLDER);
    if(!files.length){
      tree.innerHTML = '<div style="color:#ef4444;font-size:11px;padding:4px">找不到 CSV 檔案</div>';
      spStatus('找不到 CSV 檔案');
      return;
    }
    var byFolder = {};
    files.forEach(function(f){
      if(!byFolder[f.folder]) byFolder[f.folder] = [];
      byFolder[f.folder].push(f);
    });
    var html = '';
    Object.keys(byFolder).forEach(function(fld){
      html += '<div style="color:#22d3ee;font-size:9px;font-weight:700;margin-top:6px;margin-bottom:3px;letter-spacing:.08em">📁 '+esc(fld)+'</div>';
      byFolder[fld].forEach(function(f){
        var isEnv  = f.name.toLowerCase().includes('env');
        var isRisk = f.name.toLowerCase().includes('risk');
        var col = isEnv ? '#4ade80' : isRisk ? '#60a5fa' : '#94a3b8';
        html += '<div class="sp-file-item" data-fileid="'+esc(f.id)+'" data-filename="'+esc(f.name)+'" style="color:'+col+'">'
          +(isEnv?'🌿':isRisk?'🛡️':'📄')+' '+esc(f.name)+'</div>';
      });
    });
    tree.innerHTML = html;
    spStatus('✅ 找到 '+files.length+' 個 CSV，點擊載入');
  }catch(e){
    tree.innerHTML = '<div style="color:#ef4444;font-size:11px;padding:4px">❌ '+esc(e.message)+'</div>';
    spStatus('失敗：'+e.message);
  }
}

function spStatus(msg){ var el=document.getElementById('sp-status'); if(el) el.textContent=msg; }

// Click on SP file item
document.addEventListener('click', function(e){
  var item = e.target.closest('.sp-file-item');
  if(!item) return;
  var id = item.dataset.fileid, name = item.dataset.filename;
  if(!id) return;
  item.style.background = 'rgba(34,211,238,.15)';
  spStatus('⏳ 載入: '+name);
  graphReadFile(id).then(function(text){
    var isEnv = name.toLowerCase().includes('env');
    processCSVText(text, isEnv?'env':'risk', name);
    spStatus('✅ 已載入: '+name);
    // 方案 A：嘗試取得鎖定
    lockAcquire(name).then(function(ok){
      if(ok) toast('✅ 已載入並鎖定: '+name+'（其他人開啟時會收到警告）','ok');
    });
  }).catch(function(err){
    spStatus('❌ '+err.message);
    toast('讀取失敗: '+err.message, 'err');
    item.style.background = '';
  });
});

// ── EVENT DELEGATION (extends ehs_system.js) ──
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) { if(e.target.id==='modal-overlay') closeModal(); return; }
  var a = el.dataset.action, d = el.dataset;
  switch(a){
    case 'ms-login':  msLogin(); break;
    case 'ms-logout': msLogout(); break;
    case 'switch-tab': switchTab(d.tab); break;
    case 'show-format': showFormatModal(); break;
    case 'close-modal': closeModal(); break;
    case 'load-demo': loadDemo(); break;
    case 'create-proc': createProc(); break;
    case 'delete-proc': deleteProc(d.pid); break;
    case 'select-proc': selectProc(d.pid); break;
    case 'export-csv':
      exportCSV();
      if(typeof lockRelease === 'function' && currentLockFile) lockRelease();
      break;
    case 'add-step': addStep(d.pid); break;
    case 'delete-step': deleteStep(d.pid,d.sid); break;
    case 'add-env': addEnv(d.pid,d.sid); break;
    case 'delete-env': deleteEnv(d.pid,d.sid,d.eid); break;
    case 'add-saf': addSaf(d.pid,d.sid); break;
    case 'delete-saf': deleteSaf(d.pid,d.sid,d.sfid); break;
    case 'open-env-file': document.getElementById('inp-env').click(); break;
    case 'open-risk-file': document.getElementById('inp-risk').click(); break;
    case 'sp-browse': spBrowse(); break;
    case 'force-unlock': forceUnlock(); break;
  }
});

document.addEventListener('change', function(e){
  var el=e.target, a=el.dataset.action;
  if(!a){ if(el.id==='sel-year'||el.id==='sel-plant'||el.id==='inp-dept') updateHint(); return; }
  if(a==='csv-env'){ handleCSV(el,'env'); return; }
  if(a==='csv-risk'){ handleCSV(el,'risk'); return; }
  var d=el.dataset, pid=d.pid, sid=d.sid, eid=d.eid, sfid=d.sfid, field=d.field;
  switch(a){
    case 'proc-field': setProcField(pid,field,el.value); break;
    case 'set-common': setCommon(pid,sid,field,el.value); break;
    case 'set-common-mat': setCommonMat(pid,sid,el.value); break;
    case 'set-step-name': setStepName(pid,sid,el.value); break;
    case 'env-field': setEnvField(pid,sid,eid,field,el.value); break;
    case 'env-cat': setEnvCat(pid,sid,eid,el.value); break;
    case 'env-calc': setEnvCalc(pid,sid,eid,field,el.value); break;
    case 'env-vio': setEnvVio(pid,sid,eid,field,el.checked); break;
    case 'saf-field': setSafField(pid,sid,sfid,field,el.value); break;
    case 'saf-cat': setSafCat(pid,sid,sfid,el.value); break;
    case 'saf-calc': setSafCalc(pid,sid,sfid,field,el.value); break;
    case 'saf-vio': setSafVio(pid,sid,sfid,field,el.checked); break;
  }
});

// Init
initMsal();
</script>
